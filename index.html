<!DOCTYPE html>
<!-- 버스도착 PWA 본체 — config.json의 정류장·노선을 Cloudflare Worker 프록시로 조회해 도착예정을 표시 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>버스도착</title>
<!-- ▼ PWA 태그: <title> 아래에 삽입 -->
<meta name="description" content="서울 버스 정류장 도착예정 시간">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#30A2FF">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="버스">
<!-- ▲ PWA 태그 끝 -->
<style>
:root{--p:#30A2FF;--pd:#1B7FD6;--bg:#EAF4FF;--tx:#1A2B3C;--mut:#6B7A8C;--card:#fff;--line:#D6E6F5;
 --soon:#E8590C;--off:#9AA3AB;
 --c1:#66CCFF;--c2:#5BB025;--c3:#3D5BAB;--c4:#53B332;--c5:#F2B000;--c6:#E60012;--c13:#3D5BAB;--c14:#0E7C86;--c15:#1F2F6B;--c0:#8A939B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif}
body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(27,127,214,.25)}
.top .logo{width:34px;height:34px;border-radius:9px;background:#EAF4FF;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.top .ttl{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.top .sub{font-size:11px;opacity:.92;margin-top:2px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.ring{width:38px;height:38px;border-radius:50%;background:conic-gradient(#fff 0 var(--pct,0%),rgba(255,255,255,.25) var(--pct,0%) 100%);display:flex;align-items:center;justify-content:center}
.ring b{width:30px;height:30px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.ring.paused{background:rgba(255,255,255,.25)}
.rbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.rbtn:active{background:rgba(255,255,255,.4)}
.rbtn.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.body{padding:12px 12px 20px;max-width:560px;margin:0 auto}
.stop{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(30,80,130,.06);margin-bottom:12px;overflow:hidden;transition:opacity .3s}
.stop.stale{opacity:.55}
.stop .sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:#F7FBFF}
.stop .ars{background:var(--tx);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.5px;flex:none}
.stop .nm{font-weight:800;font-size:16px;white-space:nowrap}
.stop .dir{font-size:11px;color:var(--mut);margin-left:auto;text-align:right;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #EEF3F8}
.row:last-child{border-bottom:0}
.rt{min-width:64px;height:40px;padding:0 8px;border-radius:10px;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;letter-spacing:.3px;flex:none}
.arr{flex:1;min-width:0}
.a1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.a1 .t{font-size:26px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.a1 .t.soon{color:var(--soon)}
.a1 .t.off{color:var(--off);font-size:19px}
.a1 .s{font-size:12px;color:var(--mut)}
.a2{font-size:12.5px;color:var(--mut);margin-top:3px}
.a2 b{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
.tg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid;white-space:nowrap}
.tg.low{color:#1C7A3F;border-color:#BFE3CC;background:#EDF9F1}
.tg.c3{color:#1C7A3F;border-color:#BFE3CC;background:#EDF9F1}
.tg.c4{color:#3D5BAB;border-color:#C5D2F0;background:#EEF2FC}
.tg.c5{color:#B54708;border-color:#F7D9B5;background:#FFF5E8}
.tg.c6{color:#B42318;border-color:#F0C4C0;background:#FEF0EF}
.tg.last{color:#7D3C98;border-color:#DCC6E8;background:#F6EEFA}
.tg.full{color:#B42318;border-color:#F0C4C0;background:#FEF0EF}
.none{padding:12px 14px;color:var(--mut);font-size:13px}
.banner{margin:0 0 12px;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;display:none}
.banner.show{display:block}
.banner.err{background:#FFF5E8;border:1px solid #F7D9B5;color:#B54708}
.banner.off{background:#EEF1F5;border:1px solid #D5DBE3;color:#4B5563}
.banner b{display:block;font-size:13px;margin-bottom:2px}
.foot{display:flex;align-items:center;gap:10px;padding:4px 4px 0;font-size:12px;color:var(--mut)}
.sw{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--tx);cursor:pointer;user-select:none}
.sw i{width:38px;height:22px;border-radius:11px;background:#C5CFDA;position:relative;display:inline-block;transition:background .2s}
.sw i:after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on i{background:var(--p)}.sw.on i:after{left:18px}
.skel{padding:14px;color:var(--mut);font-size:13px}
.fatal{margin:16px 12px;background:#FEF0EF;border:1px solid #F0C4C0;color:#B42318;border-radius:12px;padding:14px;font-size:13px;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>
<div class="top">
  <div class="logo">🚌</div>
  <div><div class="ttl">버스도착</div><div class="sub" id="sub">불러오는 중…</div></div>
  <div class="right">
    <div class="ring" id="ring" title="다음 자동갱신까지"><b id="ringN">–</b></div>
    <button class="rbtn" id="btnR" title="지금 새로고침" aria-label="새로고침">↻</button>
  </div>
</div>

<div class="body">
  <div class="banner off" id="bOff"><b>📴 오프라인</b>네트워크가 연결되면 자동으로 다시 조회해.</div>
  <div class="banner err" id="bErr"></div>
  <div id="stops"><div class="skel">설정을 불러오는 중…</div></div>
  <div class="foot">
    <span>출처: 서울시 TOPIS</span>
    <span class="sw on" id="sw" role="switch" aria-checked="true">자동갱신 <i></i></span>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const ROUTE_COLOR={'1':'var(--c1)','2':'var(--c2)','3':'var(--c3)','4':'var(--c4)','5':'var(--c5)','6':'var(--c6)','13':'var(--c13)','14':'var(--c14)','15':'var(--c15)'};
const CONG={'3':['여유','c3'],'4':['보통','c4'],'5':['혼잡','c5'],'6':['매우혼잡','c6']};
const RETRY_SEC=15;

let cfg=null, auto=true, timer=null, tick=null, nextAt=0, period=30, lastOk=0, lastData={}, busy=false;

/* ── 설정 로드·검증 ── */
async function loadConfig(){
  let c;
  try{ const r=await fetch('config.json?ts='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); c=await r.json(); }
  catch(e){ throw new Error('config.json을 읽지 못했어: '+e.message); }
  const errs=[];
  if(typeof c.proxyUrl!=='string'||!/^https:\/\//.test(c.proxyUrl)) errs.push('proxyUrl은 https://로 시작해야 함 (현재: '+c.proxyUrl+')');
  if(/YOUR-ACCOUNT/.test(c.proxyUrl||'')) errs.push('proxyUrl이 아직 예시값이야. Cloudflare Worker 주소로 바꿔줘');
  const rs=Number(c.refreshSec);
  if(!(rs>=10&&rs<=300)) errs.push('refreshSec는 10~300 사이 숫자 (현재: '+c.refreshSec+')');
  if(!Array.isArray(c.stops)||!c.stops.length) errs.push('stops가 비어 있음');
  else c.stops.forEach((s,i)=>{
    if(!/^\d{5}$/.test(String(s.arsId||''))) errs.push('stops['+(i+1)+'] arsId는 5자리 숫자 (현재: '+s.arsId+')');
    if(!Array.isArray(s.routes)||!s.routes.length) errs.push('stops['+(i+1)+'] routes가 비어 있음');
    if(!s.name) s.name=String(s.arsId);
  });
  if(errs.length) throw new Error('config.json 오류:\n- '+errs.join('\n- '));
  c.proxyUrl=c.proxyUrl.replace(/\/+$/,'');
  c.refreshSec=rs;
  c.stops.forEach(s=>{ s.arsId=String(s.arsId); s.routes=s.routes.map(x=>String(x).trim()); });
  return c;
}

/* ── 도착메시지 파싱: "3분27초후[2번째 전]" → {sec:207, stopsLeft:"2번째 전"} ── */
function parseMsg(m){
  m=(m||'').trim();
  const br=m.match(/\[(.*?)\]/); const stopsLeft=br?br[1].trim():'';
  const body=m.replace(/\[.*?\]/,'').trim();
  let sec=null;
  const a=body.match(/(\d+)\s*분\s*(\d+)\s*초/); const b=body.match(/(\d+)\s*분/); const c=body.match(/(\d+)\s*초/);
  if(a) sec=+a[1]*60+ +a[2]; else if(b) sec=+b[1]*60; else if(c) sec=+c[1];
  const soon=/곧\s*도착/.test(body);
  const off=!soon&&sec===null; // 운행종료·출발대기·막차운행종료·회차대기·빈값 등
  return {raw:m, body, stopsLeft, sec, soon, off};
}
function fmtSec(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m?(m+'분 '+r+'초'):(r+'초'); }

/* ── 렌더 ── */
function render(){
  const box=$('stops'); box.innerHTML='';
  cfg.stops.forEach(st=>{
    const d=lastData[st.arsId];
    const el=document.createElement('div'); el.className='stop'+(d&&d.stale?' stale':''); el.dataset.ars=st.arsId;
    const first=d&&d.items&&d.items[0];
    const dir=first?((d.stNm||'')+(first.adirection?' · '+first.adirection+' 방면':'')):(d&&d.error?'':'조회 중…');
    el.innerHTML='<div class="sh"><span class="ars">'+st.arsId+'</span><span class="nm">'+esc(st.name)+'</span><span class="dir">'+esc(dir)+'</span></div>';
    if(!d){ el.insertAdjacentHTML('beforeend','<div class="none">조회 중…</div>'); box.appendChild(el); return; }
    if(d.error&&!d.items){ el.insertAdjacentHTML('beforeend','<div class="none">⚠ '+esc(d.error)+'</div>'); box.appendChild(el); return; }
    st.routes.forEach(rt=>{
      const it=d.items.find(x=>x.rtNm===rt||x.busRouteAbrv===rt);
      const color=it?(ROUTE_COLOR[String(it.routeType)]||'var(--c0)'):'var(--c0)';
      const row=document.createElement('div'); row.className='row';
      if(!it){
        row.innerHTML='<div class="rt" style="background:'+color+'">'+esc(rt)+'</div><div class="arr"><div class="a1"><span class="t off">정보 없음</span></div><div class="a2">이 정류장 응답에 해당 노선이 없음</div></div><div class="tags"></div>';
        el.appendChild(row); return;
      }
      const p1=parseMsg(it.arrmsg1), p2=parseMsg(it.arrmsg2);
      row.dataset.sec1=p1.sec==null?'':p1.sec; row.dataset.sec2=p2.sec==null?'':p2.sec; row.dataset.t=d.at;
      const tags=[];
      if(it.busType1==='1') tags.push('<span class="tg low">저상</span>');
      if(it.isLast1==='1') tags.push('<span class="tg last">막차</span>');
      if(it.isFullFlag1==='1') tags.push('<span class="tg full">만차</span>');
      if(CONG[it.congetion1]) tags.push('<span class="tg '+CONG[it.congetion1][1]+'">'+CONG[it.congetion1][0]+'</span>');
      row.innerHTML='<div class="rt" style="background:'+color+'">'+esc(it.busRouteAbrv||it.rtNm)+'</div>'+
        '<div class="arr"><div class="a1"><span class="t" data-k="t1"></span><span class="s" data-k="s1"></span></div>'+
        '<div class="a2">다음 <b data-k="t2"></b> <span data-k="s2"></span></div></div>'+
        '<div class="tags">'+tags.join('')+'</div>';
      row._p1=p1; row._p2=p2; row._it=it;
      el.appendChild(row);
    });
    box.appendChild(el);
  });
  paintTimes();
}
/* 1초마다 호출: 옵션A 로컬 카운트다운 */
function paintTimes(){
  const now=Date.now();
  document.querySelectorAll('.row').forEach(row=>{
    if(!row._p1) return;
    const el1=row.querySelector('[data-k=t1]'), s1=row.querySelector('[data-k=s1]'), el2=row.querySelector('[data-k=t2]'), s2=row.querySelector('[data-k=s2]');
    const elapsed=(now-(+row.dataset.t||now))/1000;
    const one=(p,el,sEl,big)=>{
      if(p.sec!=null){
        const rem=p.sec-elapsed;
        if(rem<=0){ el.textContent='곧 도착'; el.className=big?'t soon':''; sEl.textContent=''; }
        else { el.textContent=fmtSec(rem); el.className=big?'t':''; sEl.textContent=p.stopsLeft?(big?p.stopsLeft:'· '+p.stopsLeft):''; }
      } else if(p.soon){ el.textContent='곧 도착'; el.className=big?'t soon':''; sEl.textContent=''; }
      else { el.textContent=p.body||'—'; el.className=big?'t off':''; sEl.textContent=''; }
    };
    one(row._p1,el1,s1,true); one(row._p2,el2,s2,false);
  });
}

/* ── 조회 ── */
async function fetchStop(st){
  const r=await fetch(cfg.proxyUrl+'/?arsId='+st.arsId,{cache:'no-store'});
  let j; try{ j=await r.json(); }catch(_){ throw new Error('프록시 응답이 JSON이 아님 (HTTP '+r.status+')'); }
  if(!j.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function refresh(manual){
  if(busy) return; busy=true; $('btnR').classList.add('spin');
  if(!navigator.onLine){ $('bOff').classList.add('show'); busy=false; $('btnR').classList.remove('spin'); schedule(); return; }
  $('bOff').classList.remove('show');
  const now=Date.now(); let anyErr=null, anyOk=false;
  await Promise.all(cfg.stops.map(async st=>{
    try{ const j=await fetchStop(st); lastData[st.arsId]={items:j.items,stNm:j.stNm,at:now,stale:false}; anyOk=true; }
    catch(e){ anyErr=e.message; const prev=lastData[st.arsId]; lastData[st.arsId]=prev?{...prev,stale:true,error:e.message}:{error:e.message,at:now}; }
  }));
  if(anyOk) lastOk=now;
  if(anyErr){ $('bErr').innerHTML='<b>⚠ 조회 실패 — '+RETRY_SEC+'초 후 재시도</b>'+esc(anyErr); $('bErr').classList.add('show'); }
  else $('bErr').classList.remove('show');
  $('sub').textContent=(anyOk?hhmmss(now)+' 갱신':'갱신 실패')+' · 자동 '+cfg.refreshSec+'초';
  render();
  busy=false; $('btnR').classList.remove('spin');
  schedule(anyErr?RETRY_SEC:cfg.refreshSec);
}
function schedule(sec){
  clearTimeout(timer); sec=sec||cfg.refreshSec;
  if(!auto||document.hidden){ nextAt=0; $('ring').classList.add('paused'); $('ringN').textContent=auto?'⏸':'off'; return; }
  $('ring').classList.remove('paused'); nextAt=Date.now()+sec*1000; period=sec;
  timer=setTimeout(()=>refresh(false),sec*1000);
}
function hhmmss(t){ const d=new Date(t); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── 이벤트 ── */
$('btnR').addEventListener('click',()=>refresh(true));
$('sw').addEventListener('click',()=>{ auto=!auto; $('sw').classList.toggle('on',auto); $('sw').setAttribute('aria-checked',auto); if(auto) refresh(true); else schedule(); });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ clearTimeout(timer); schedule(); }
  else if(auto){ if(Date.now()-lastOk>10000) refresh(true); else schedule(); }
});
window.addEventListener('online',()=>refresh(true));
window.addEventListener('offline',()=>{ $('bOff').classList.add('show'); clearTimeout(timer); });

/* 1초 틱: 카운트다운 + 링 */
tick=setInterval(()=>{
  paintTimes();
  if(!cfg) return;
  if(nextAt&&auto&&!document.hidden){
    const rem=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
    $('ringN').textContent=rem; $('ring').style.setProperty('--pct',Math.round(100*(1-rem/period))+'%');
  }
},1000);

/* ── 시작 ── */
loadConfig().then(c=>{ cfg=c; render(); refresh(true); })
  .catch(e=>{ $('stops').innerHTML='<div class="fatal">'+esc(e.message)+'</div>'; $('sub').textContent='설정 오류'; $('ringN').textContent='!'; });

window.__bus={parseMsg,fmtSec,loadConfig:()=>cfg,data:()=>lastData}; // 테스트용
})();
</script>
<!-- ▼ 서비스워커 등록: </body> 직전에 삽입 -->
<script>
// PWA 서비스워커 등록 (https 또는 localhost에서만 동작)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.log('SW 등록 실패:', err);
    });
  });
}
</script>
<!-- ▲ 서비스워커 등록 끝 -->
</body>
</html>
